name: Database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create backup
        run: |
          mkdir -p backups
          pg_dump "$DATABASE_URL" -F c -f "backups/backup_$(date +'%Y-%m-%d_%H-%M-%S').dump"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload backup to Backblaze B2
        run: |
          latest_backup=$(ls -t backups/*.dump | head -n 1)
          node upload-backup-to-b2.js "$latest_backup"
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
